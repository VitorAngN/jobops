name: Busca diária de vagas

on:
  schedule:
    # 10:17 UTC = 07:17 em Brasília, todo dia
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acordar o servidor (o plano gratuito dorme)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 "$JOBOPS_URL/api/health" && exit 0
            sleep 20
          done
          echo "Servidor não respondeu" && exit 1
        env:
          JOBOPS_URL: ${{ secrets.JOBOPS_URL }}

      - name: Rodar a busca
        run: |
          curl -fsS --max-time 300 -X POST "$JOBOPS_URL/api/cron/discovery" \
            -H "Authorization: Bearer $CRON_TOKEN" | tee resultado.json
          echo
          echo "### Resultado da busca" >> "$GITHUB_STEP_SUMMARY"
          cat resultado.json >> "$GITHUB_STEP_SUMMARY"
        env:
          JOBOPS_URL: ${{ secrets.JOBOPS_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
